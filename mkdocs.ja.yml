site_name: AlphaForge ドキュメント
site_url: https://alforgelabs.com/ja/docs/
site_description: AlphaForge CLI 公式ドキュメント — インストール、コマンド、戦略テンプレート、AI エージェント連携。
site_author: Alforge Labs

docs_dir: mkdocs_src/ja
site_dir: ja/docs
use_directory_urls: true

theme:
  name: material
  language: ja
  palette:
    - scheme: slate
      primary: black
      accent: amber
  font:
    text: Space Grotesk
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra:
  # LP (templates/_partials/head_meta.html.j2) と同一の GA4 プロパティで docs も計測する
  analytics:
    provider: google
    property: G-K8LQ5G28RY
  homepage: https://alforgelabs.com/ja/index.html
  # alpha-bot#664: docs footer に X フォロー導線 (mkdocs-material extra.social)
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Alforge_bot
      name: Follow @Alforge_bot on X
  alternate:
    - name: 日本語
      link: /ja/docs/
      lang: ja
    - name: English
      link: /en/docs/
      lang: en

plugins:
  - search:
      lang: ja

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - はじめに:
      - クイックスタートと詳細インストール: getting-started.md
      - Trial 制限: guides/trial-limits.md
  - AI エージェント連携:
      - 概要: ai-agents/index.md
      - エージェントクイックスタート: ai-agents/quickstart.md
      - AI 駆動の戦略探索ワークフロー: ai-agents/exploration-workflow.md
      - alpha-forge-mcp リファレンス: ai-agents/mcp-reference.md
      - エージェントから見た CLI 規約: ai-agents/cli-conventions.md
      - --json 出力リファレンス: ai-agents/json-output-reference.md
  - ガイド:
      - エンドツーエンド戦略開発ワークフロー: guides/end-to-end-workflow.md
      - 実行結果と成果物サンプル: guides/output-examples.md
      - TradingView への Pine Script 反映: guides/tradingview-pine-integration.md
      - Combine Portfolio Pine — 複数戦略統合: guides/combine-portfolio-pine.md
      - TradingView と alpha-strike の連携: guides/tradingview-alpha-strike.md
      - alpha-strike セットアップガイド: guides/alpha-strike-setup.md
      - FRED マクロデータ活用ガイド: guides/macro-data.md
      - 用語集: guides/glossary.md
      - 目的別ユースケース:
          - 概要: usecases/index.md
          - TradingViewユーザー: usecases/tradingview.md
          - Python開発者: usecases/python-dev.md
          - クオンツ・研究者: usecases/quants.md
          - 自動売買検討者: usecases/auto-trading.md
          - AIエージェント利用者: usecases/ai-agents.md
          - 裁量トレーダーのシステム化: usecases/discretionary.md
          - 他ツールとの比較: usecases/comparison.md
  - 戦略カタログ:
      - 戦略テンプレート: templates.md
      - 戦略実例ギャラリー: strategy-gallery.md
  - データ可視化:
      - 概要: alpha-visualizer/index.md
      - インストール: alpha-visualizer/installation.md
      - 機能詳細: alpha-visualizer/features.md
      - 設定: alpha-visualizer/configuration.md
      - FAQ: alpha-visualizer/faq.md
      - リリースノート:
          - v0.9.0 (2026-07-19): alpha-visualizer/release-0.9.0.md
          - v0.7.1 (2026-06-02): alpha-visualizer/release-0.7.1.md
          - v0.2.0 (2026-05-11): alpha-visualizer/release-0.2.0.md
  - CLI リファレンス:
      - 概要: cli-reference/index.md
      - コアコマンド:
          - strategy: cli-reference/strategy.md
          - backtest: cli-reference/backtest.md
          - optimize: cli-reference/optimize.md
          - explore: cli-reference/explore.md
          - live: cli-reference/live.md
          - pine: cli-reference/pine.md
          - journal: cli-reference/journal.md
          - idea: cli-reference/idea.md
          - data: cli-reference/data.md
      - 補助コマンド:
          - analyze: cli-reference/analyze.md
          - system: cli-reference/system.md
      - メタコマンド:
          - self: cli-reference/self.md
  - 変更履歴: changelog.md
  - 利用規約と免責:
      - 信頼・安全・制限: legal/trust-safety-limits.md
      - 免責事項: legal/disclaimers.md
      - EULA: legal/eula.md
      - プライバシーポリシー: legal/privacy.md

name: Tests

# リポジトリの回帰テスト（LP コピー/コンポーネント整合・mkdocs 文書間リンク・
# install.ps1 の PATH マージ純粋関数）を PR と main push で実行する。
# テストが CI で一度も実行されず、サイト刷新時に stale 化したまま放置されていた
# 問題の再発防止。ubuntu-latest には pwsh が同梱されているため
# install.ps1 の PowerShell テストも skip されず実際に走る。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - name: Run unittest suite
        run: uv run python -m unittest discover tests -v

site_name: AlphaForge Documentation
site_url: https://alforgelabs.com/en/docs/
site_description: AlphaForge CLI official documentation — installation, commands, strategy templates, and AI agent integration.
site_author: Alforge Labs

docs_dir: mkdocs_src/en
site_dir: en/docs
use_directory_urls: true

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: black
      accent: amber
  font:
    text: Space Grotesk
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra:
  homepage: https://alforgelabs.com/en/index.html
  # alpha-bot#664: docs footer に X フォロー導線 (mkdocs-material extra.social)
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Alforge_bot
      name: Follow @Alforge_bot on X
  alternate:
    - name: 日本語
      link: /ja/docs/
      lang: ja
    - name: English
      link: /en/docs/
      lang: en

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart & Detailed Installation: getting-started.md
      - Trial Limits: guides/trial-limits.md
  - AI Agent Integration:
      - Overview: ai-agents/index.md
      - Agent Quickstart: ai-agents/quickstart.md
      - AI-Driven Strategy Exploration Workflow: ai-agents/exploration-workflow.md
      - alpha-forge-mcp Reference: ai-agents/mcp-reference.md
      - CLI Conventions for Agents: ai-agents/cli-conventions.md
      - --json Output Reference: ai-agents/json-output-reference.md
  - Guides:
      - End-to-End Strategy Development Workflow: guides/end-to-end-workflow.md
      - Output Examples: guides/output-examples.md
      - Bringing Pine Scripts into TradingView: guides/tradingview-pine-integration.md
      - Combine Portfolio Pine — Multi-Strategy: guides/combine-portfolio-pine.md
      - TradingView × alpha-strike Integration: guides/tradingview-alpha-strike.md
      - alpha-strike Setup Guide: guides/alpha-strike-setup.md
      - FRED Macro Data Guide: guides/macro-data.md
      - Glossary: guides/glossary.md
      - Use Cases by Goal:
          - Overview: usecases/index.md
          - TradingView Users: usecases/tradingview.md
          - Python Developers: usecases/python-dev.md
          - Quants & Researchers: usecases/quants.md
          - Automated Trading: usecases/auto-trading.md
          - AI Agent Users: usecases/ai-agents.md
          - Discretionary → Systematic: usecases/discretionary.md
          - Comparison with Other Tools: usecases/comparison.md
  - Strategy Catalog:
      - Strategy Templates: templates.md
      - Strategy Gallery: strategy-gallery.md
  - Visualization:
      - Overview: alpha-visualizer/index.md
      - Installation: alpha-visualizer/installation.md
      - Features: alpha-visualizer/features.md
      - Configuration: alpha-visualizer/configuration.md
      - FAQ: alpha-visualizer/faq.md
      - Release Notes:
          - v0.7.1 (2026-06-02): alpha-visualizer/release-0.7.1.md
          - v0.2.0 (2026-05-11): alpha-visualizer/release-0.2.0.md
  - CLI Reference:
      - Overview: cli-reference/index.md
      - Core commands:
          - strategy: cli-reference/strategy.md
          - backtest: cli-reference/backtest.md
          - optimize: cli-reference/optimize.md
          - explore: cli-reference/explore.md
          - live: cli-reference/live.md
          - pine: cli-reference/pine.md
          - journal: cli-reference/journal.md
          - idea: cli-reference/idea.md
          - data: cli-reference/data.md
      - Auxiliary commands:
          - analyze: cli-reference/analyze.md
          - system: cli-reference/system.md
      - Meta commands:
          - self: cli-reference/self.md
  - Changelog: changelog.md
  - Legal & Disclaimers:
      - Trust, Safety, and Limits: legal/trust-safety-limits.md
      - Disclaimers: legal/disclaimers.md
      - EULA: legal/eula.md
      - Privacy Policy: legal/privacy.md

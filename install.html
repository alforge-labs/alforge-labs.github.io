<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0;url=/ja/install.html" />
  <link rel="canonical" href="https://alforgelabs.com/ja/install.html" />
  <script>
    // 言語設定（al_lang）を保存済みのユーザーは対応言語版へ。既定は /ja/。
    var lang = 'ja';
    try { if (localStorage.getItem('al_lang') === 'en') lang = 'en'; } catch (e) {}
    window.location.replace('/' + lang + '/install.html');
  </script>
</head>
<body></body>
</html>
